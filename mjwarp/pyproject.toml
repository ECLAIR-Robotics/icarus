[project]
name = "icarus-mjwarp"
version = "0.1.0"
description = "GPU-batched MuJoCo Warp environment for MARS, built on mars_sim_driver's robot model."
requires-python = ">=3.10,<3.13"
dependencies = [
    "glfw",
    "mujoco>=3.8.0",
    "mujoco-warp",
    "numpy",
]

[tool.uv]
package = false

# Same style as innate-os/pyproject.toml.
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.isort]
# Imported via _driver_pkg's sys.path entry; sorting it as first-party keeps it after that import.
known-first-party = ["mars_sim_driver"]
